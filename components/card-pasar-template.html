<template id="card-pasar-template">
    <div class="card-pasar card card-hover rounded-4 w-100">
        <img src="${pasar.gambarBanner}" class="card-img-top img-top rounded-top-4" alt="Banner ${pasar.nama}"
            onerror="this.onerror=null;this.src='https://placehold.co/600x400/cccccc/ffffff?text=Not+Found';">
        <div class="card-body d-flex align-items-center">
            <div class="me-3 flex-shrink-0">
                <img src="${pasar.gambarLogo}" alt="Logo ${pasar.nama}" class="img-fluid rounded-circle logo-pasar"
                    onerror="this.onerror=null;this.src='https://placehold.co/100x100/cccccc/ffffff?text=Logo';">
            </div>
            <div class="text-start w-100">
                <h4 class="card-title mb-0 judul-pasar w-75">${pasar.nama}</h4>
                <p class="card-text mb-0 judul-sub-pasar opacity-75 text-muted">${pasar.daerah}</p>
            </div>
        </div>
    </div>
</template>
